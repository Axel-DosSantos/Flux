<style>
/* Layout: one centered 16:9 arcade screen, thin legend above, touch pad below on phones */
:root{
  --bg:#05060c;
  --edge:#161b30;
  --ink:#e8f6ff;
  --muted:#7a86a3;
  --cyan:#3ef0ff;
  --pink:#ff2e88;
  --gold:#ffd23e;
  --display:'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);box-sizing:border-box;
  padding-inline:16px;padding-block:16px;min-height:100%;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:min(1100px, calc((100vh - 130px) * 1.7778));min-width:0;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 16px}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.42em;color:var(--cyan);text-shadow:0 0 12px rgba(62,240,255,.5)}
.legend{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
kbd{font-family:var(--mono);font-size:11px;color:var(--ink);border:1px solid var(--edge);border-bottom-width:2px;border-radius:3px;padding:0 4px}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:1px solid var(--edge);border-radius:4px;background:var(--bg);outline:none;touch-action:none;cursor:pointer}
canvas:focus-visible{border-color:var(--cyan)}
.touch{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none;flex-wrap:wrap}
.touch .pad{display:flex;gap:8px}
.touch button{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);background:#0b0e1c;border:1px solid var(--edge);border-radius:10px;width:54px;height:56px;touch-action:none}
.touch button.jump{width:80px;color:var(--cyan);border-color:rgba(62,240,255,.4)}
.touch button.dash{width:80px;color:var(--pink);border-color:rgba(255,46,136,.4)}
.touch button.small{width:44px;font-size:13px;color:var(--muted)}
.touch button.on{background:#141a33;border-color:var(--ink)}
@media (pointer:coarse){.touch{display:flex}}
</style>

<div class="wrap">
  <header>
    <h1>FLUX</h1>
    <div class="legend">
      <span id="legend-keys">ZQSD / flèches diriger · Espace sauter · Maj dash · R salle · Échap pause</span>
      <span>Manette OK</span>
    </div>
  </header>
  <canvas id="game" tabindex="0" aria-label="Jeu Flux, platformer"></canvas>
  <div class="touch" aria-hidden="true">
    <div class="pad">
      <button data-a="left" id="t-left">◀</button>
      <button data-a="up" id="t-up">▲</button>
      <button data-a="down" id="t-down">▼</button>
      <button data-a="right" id="t-right">▶</button>
    </div>
    <div class="pad">
      <button data-a="pause" class="small" id="t-pause">II</button>
      <button data-a="dash" class="dash" id="t-dash">DASH</button>
      <button data-a="jump" class="jump" id="t-jump">SAUT</button>
    </div>
  </div>
</div>

function tile(tx, ty) {

  return c === '#' || (c === 'C' && crumbles[ty][tx].s !== 2);

  phase ^= 1; swapFlash = 0.18;

  forTilesIn(P.x, P.y, P.w, P.h, (c, tx, ty) => {
    if ((c === 'a' || c === 'b') && ((c === 'a') === (phase === 0))) swapPend.add(ty * COLS + tx);
    return false;
  });

}

  swapFlash = Math.max(0, swapFlash - dt);
  if (!swapPend.size) return;
  for (const k of [...swapPend]) {
    const tx = k % COLS, ty = (k / COLS) | 0;
    if (!overlap(P.x, P.y, P.w, P.h, tx * T, ty * T, T, T)) swapPend.delete(k);

}
function collide(x, y, w, h) {
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.01) / T);
  const y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.01) / T);

function loadRoom(i, keepV) {

      if (grid[y][x] === 'o') { orbs.push({ x: x * T + 10, y: y * T + 10, t: 0 }); grid[y][x] = '.'; }

function nextRoom() {
  // split for the room just cleared
  const prev = save.bestRoom[room];
  const delta = prev == null ? null : roomT - prev;
  runSplits.push({ room, t: roomT, d: roomDeaths, delta });
  // record / medal celebration
  const oldMedal = medalOf(room, prev), newMedal = medalOf(room, roomT);
  const isRecord = prev != null && roomT < prev;
  if (newMedal === 4) achieve('court');
  if (newMedal >= 3 && ROOMS.every((r, i) => i === room || medalOf(i, save.bestRoom[i]) >= 3)) achieve('or');
  if (newMedal > oldMedal) {
    showMedal(newMedal, 'MÉDAILLE ' + MEDALS[newMedal].n.toUpperCase(), (isRecord || prev == null ? 'record ' : '') + fmtS(roomT), 'medal');
  } else if (isRecord) {
    showMedal(newMedal, 'NOUVEAU RECORD', `${fmtS(roomT)}   ${fmtD(delta)}`, 'record');
  }
  if (prev == null || roomT < prev) {
    save.bestRoom[room] = roomT;
    save.ghosts[room] = ghostRec.length > 1500 ? ghostRec.slice(0, 1500) : ghostRec;
  }
  splitMsg = { text: fmtS(roomT), delta, t: 1.8, medal: medalOf(room, roomT) };
  runSplits[runSplits.length - 1].medal = splitMsg.medal;
  persist();

  if (practice) {
    // training: loop the same room so you can chase the medal
    loops++;
    // training: every try starts from zero speed, so room records stay comparable
    const slid = startTransition();
    loadRoom(room, false);
    banner = 0; showHint = false;
    flash = slid ? 0 : 0.3; addShake(2);
    sfx('clear');
    return;
  }

  const ch = ROOMS[room].ch;
  const list = chapterRooms(ch);
  if (room === list[list.length - 1]) { finishChapter(ch); return; }
  const carry = takeCarry();
  const slid = startTransition();
  loadRoom(room + 1, false);
  applyCarry(carry);
  if (slid) { banner = Math.min(banner, 1.1); addShake(2); }
  else { flash = 0.45; slowmo = 0.08; addShake(3); }
  sfx('clear');
}

/* Momentum carry: the speed you have when you leave a room is the speed you enter the next one with.

function applyCarry(c) {

  }

    P.vy = c.vy; P.grounded = false; P.coyote = 0.08;

  lookX = Math.max(-110, Math.min(110, P.vx * 0.28));

  camY = Math.max(0, Math.min(RH - H, P.y - c.sy));

/* ---------- Web build: PeerJS rooms ----------

      for (const k in patch) { if (patch[k] === null) delete cur[k]; else cur[k] = patch[k]; }
      table[selfId] = cur;

  netClose();
  const code = randCode();

  net = { peer, host: true, code, conns: new Map() };

  if (typeof Peer === 'undefined') { toast = { text: 'Multi indisponible : connexion impossible', t: 2.4 }; return; }
  netClose();

    P.dashT = DASH_T; P.canDash = false; P.dashCD = DASH_CD + DASH_T; dashBuf = 0;

    P.wallRun = false; P.padT = 0; P.grounded = false; // lipT kept: dashing right after the top still corners
    if (dx) P.face = Math.sign(dx);
    hitstop = 0.03; addShake(3);
    ring(P.x + P.w / 2, P.y + P.h / 2, C.pink, 14, 200);
    sfx('dash');
  }
  if (P.dashT > 0) {
    // super / hyper jump: jump while dashing along the ground
    if (jumpBuf > 0 && P.dashDx !== 0 && (P.coyote > 0 || collide(P.x, P.y + 1, P.w, P.h))) {
      const dx = Math.sign(P.dashDx), hyper = P.dashDy > 0.1;
      P.vx = dx * RUN * (hyper ? 1.8 : 1.5); P.vy = hyper ? -400 : -JUMP;
      P.dashT = 0; jumpBuf = 0; P.grounded = false; P.coyote = 0; P.landT = 0; P.face = dx; P.boostT = 0.35;
      P.sx = 1.45; P.sy = 0.7;
      dust(P.x + P.w / 2, P.y + P.h, 10, -dx, C.pink);
      ring(P.x + P.w / 2, P.y + P.h, C.white, 12, 200);
      if (hyper) {
        // hyper gives the dash back
        P.canDash = false; refillDash();
        techBurst('HYPER !', P.x + P.w / 2, P.y + P.h / 2, C.pink, 'hyper');
        countStat('hypers', 25, 'hyper');
      } else {
        addShake(3);
        pops.push({ x: P.x + P.w / 2, y: P.y - 6, text: 'SUPER', t: 0.7, max: 0.7 });
        addFlow(8);
        sfx('super');
      }
      return;
    }
    // CORNER: only in the first instants of a dash launched right at a wall corner
    if (DASH_T - P.dashT < CORNER_WIN) {
      const c = findCorner();
      if (c) { P.x = c.x; P.y = c.y; cornerBoost(c.side); return; }
    }
    P.coyote -= dt;
    P.dashT -= dt;
    P.vx = P.dashDx * DASH; P.vy = P.dashDy * DASH;
    if (P.dashT <= 0) {
      P.postDashT = 0.3; // a short window after the dash still counts as "coming from a dash"
      P.vx = P.dashDx * RUN * 1.3;
      P.vy = P.dashDy < 0 ? P.dashDy * 320 : P.dashDy * 200;
    }
    P.hitT = 0;
    moveX(P.vx * dt);
    if (P.hitT > 0 && P.dashDx !== 0 && P.hitSide === Math.sign(P.dashDx) && P.dashDy <= 0.1) {
      // dashed into a wall: turn the dash straight into a fast wall run
      // still inside the corner window: if this fast climb reaches the top in time, it's a corner
      P.cornerPend = CORNER_WIN - (DASH_T - P.dashT);
      P.dashT = 0; P.wallRun = true; P.wallSide = P.hitSide; P.vy = -RUN_MAX; P.vx = 0; P.hitT = 0; P.runGrace = 0.3;
      P.dashRun = false;
      P.sx = 0.7; P.sy = 1.4; addShake(2.5);
      ring(P.hitSide > 0 ? P.x + P.w : P.x, P.y + P.h / 2, accent(), 12, 180);
      sfx('run');
      crumbleTouch();
      return;
    }
    moveY(P.vy * dt);
    P.grounded = collide(P.x, P.y + 1, P.w, P.h);
    P.sx = 1.35; P.sy = 0.75;
    if (Math.random() < 0.8) parts.push({ x: P.x + P.w / 2, y: P.y + P.h / 2, vx: 0, vy: 0, life: 0.2, max: 0.2, c: C.pink, s: 3, g: 0 });
    crumbleTouch();
    interact(dt);
    return;
  }

  /* --- horizontal --- */
  const turning = dir !== 0 && P.vx !== 0 && Math.sign(P.vx) !== dir;
  P.boostT -= dt;
  if (P.boostT > 0 && Math.abs(P.vx) > RUN && dir !== -Math.sign(P.vx)) {
    // momentum window after a corner / super / hyper: the speed is kept even with no input
  } else if (dir === 0 && Math.abs(P.vx) > RUN && P.boostT > -0.25) {
    // window just ended with no input: coast down instead of stopping dead
    P.vx = approach(P.vx, 0, (P.grounded ? 900 : 300) * dt);
  } else if (dir !== 0 && Math.abs(P.vx) > RUN && Math.sign(P.vx) === dir) {
    // just landed: no ground friction yet, so jumping right away keeps the speed
    // holding forward with extra speed: it fades slowly, so momentum lasts
    P.vx = approach(P.vx, dir * RUN, (P.grounded ? (P.landT > 0 ? 0 : 380) : 260) * dt);
  } else {
    const accel = P.grounded ? (dir ? (turning ? 5600 : 3600) : 4400) : (dir ? 2500 : 700);
    P.vx = approach(P.vx, dir * RUN, accel * dt);
  }

  /* --- wall run --- */
  if (!P.wallRun && touching && rawDir === side) {
    // horizontal speed turns into climbing speed, and upward speed you already had adds on top
    const up = P.vy < 0 ? -P.vy : 0;
    const toward = Math.max(P.hitT > 0 && P.hitSide === side ? P.hitSpeed : 0, P.vx * side > 0 ? Math.abs(P.vx) : 0);
    const entry = Math.max(up, toward * 1.3 + up * 0.6);
    if (entry > 180) {
      P.wallRun = true; P.wallSide = side;
      P.dashRun = false; // only a wall run started by dashing into the wall can corner
      P.vy = -Math.min(RUN_MAX, entry);
      P.grounded = false; P.coyote = 0; P.hitT = 0;
      P.sx = 0.75; P.sy = 1.3;
      sfx('run');
    }
  }
  P.runGrace -= dt;
  if (P.wallRun) {
    const holding = rawDir === P.wallSide || P.runGrace > 0;
    if (!touching && P.vy < 0 && holding) {
      const side = P.wallSide;
      P.wallRun = false; P.lipDir = side; P.lipBoost = false;
      if (P.cornerPend > 0) {
        // CORNER: this wall run came from a dash. Wrap around the corner onto the top of the wall,
        // keep super speed along it, and get the dash back. No launch into the air.
        const tx = side > 0 ? Math.floor((P.x + P.w + 2) / T) : Math.floor((P.x - 2) / T);
        let ty = Math.floor((P.y + P.h) / T);
        while (ty < ROWS - 1 && !solidAt(tx, ty)) ty++;
        while (ty > 0 && solidAt(tx, ty - 1)) ty--;
        const topY = ty * T;
        const nx = side > 0 ? tx * T : (tx + 1) * T - P.w;
        if (!collide(nx, topY - P.h, P.w, P.h)) { P.x = nx; P.y = topY - P.h; }
        P.cornerCD = 0.01;
        cornerBoost(side);
      } else {
        // normal top of the wall: small pop over the edge, jump now for a boosted launch
        P.lipT = 0.16;
        {
          const tx = side > 0 ? Math.floor((P.x + P.w + 2) / T) : Math.floor((P.x - 2) / T);
          let ty = Math.floor((P.y + P.h) / T);
          while (ty < ROWS - 1 && !solidAt(tx, ty)) ty++;
          while (ty > 0 && solidAt(tx, ty - 1)) ty--;
          P.lipTop = { x: side > 0 ? tx * T : (tx + 1) * T - P.w, y: ty * T - P.h };
        }
        P.vx = side * 220; P.vy = Math.min(P.vy, -260);
        // feet can still be a few px below the top edge: lift onto it so the wall doesn't eat the exit speed
        for (let up = 0; up <= 6; up++) {
          if (!collide(P.x + side * 2, P.y - up, P.w, P.h)) { P.y -= up; break; }
        }
        dust(P.x + P.w / 2, P.y + P.h, 6, side, accent());
      }
    } else if (!touching || !holding || P.vy >= 0) {
      P.wallRun = false;
    } else {
      P.vx = P.wallSide * 30;
      if (Math.random() < 0.6) parts.push({ x: P.wallSide < 0 ? P.x : P.x + P.w, y: P.y + P.h, vx: -P.wallSide * 30,
        vy: 60, life: 0.25, max: 0.25, c: accent(), s: 2, g: 0 });
    }
  }

  /* --- jump --- */
  P.coyote = P.grounded ? 0.1 : P.coyote - dt;
  if (jumpBuf > 0) {
    if (P.lipT > 0) {
      P.vy = -LIP_JUMP; P.vx = P.lipDir * (P.lipBoost ? Math.max(Math.abs(P.vx), RUN * 1.5) : 300); P.lipT = 0; jumpBuf = 0;
      P.sx = 0.6; P.sy = 1.5;
      ring(P.x + P.w / 2, P.y + P.h, accent(), 16, 220); addShake(3);
      sfx('launch'); addFlow(6);
    } else if (P.coyote > 0) {
      P.vy = -JUMP; P.coyote = 0; jumpBuf = 0; P.grounded = false;
      P.sx = 0.7; P.sy = 1.35; dust(P.x + P.w / 2, P.y + P.h, 6); sfx('jump');
    } else if (touching) {
      const away = -side;
      P.vx = away * KICK_X; P.vy = -KICK_Y; P.lock = 0.12; P.lockDir = away; P.face = away;
      P.wallRun = false; jumpBuf = 0;
      P.sx = 0.65; P.sy = 1.4;
      dust(side < 0 ? P.x : P.x + P.w, P.y + P.h / 2, 9, away, accent());
      sfx('wall');
    }
  }

  /* --- gravity --- */
  let g;
  if (P.wallRun) g = RUN_G;
  else if (P.padT > 0) { P.padT -= dt; g = 1800; }
  else if (P.vy < 0) g = held('jump') || P.lipT > -0.3 ? 1800 : 4400;
  else g = 2600;
  if (!P.wallRun && Math.abs(P.vy) < 70 && held('jump')) g *= 0.55;
  P.vy += g * dt;

  const sliding = !P.grounded && touching && P.vy > 0 && rawDir === side;
  const maxFall = sliding ? 85 : 560;
  if (P.vy > maxFall) P.vy = sliding ? Math.max(maxFall, P.vy - 3200 * dt) : maxFall;

  moveX(P.vx * dt);
  const vyBefore = P.vy;
  moveY(P.vy * dt);
  const was = P.grounded;
  P.grounded = collide(P.x, P.y + 1, P.w, P.h);
  if (P.grounded) P.wallRun = false;
  P.landT -= dt;
  if (P.grounded && !was) P.landT = 0.1;
  if (P.grounded && !was && vyBefore > 120) {
    const k = Math.min(1, vyBefore / 560);
    P.sx = 1 + 0.45 * k; P.sy = 1 - 0.38 * k;
    dust(P.x + P.w / 2, P.y + P.h, 4 + Math.round(6 * k));
    if (vyBefore > 400) addShake(2);
    sfx('land');
  }
  crumbleTouch();

  if (interact(dt)) return;

  P.animT = (P.animT || 0) + dt * (P.wallRun ? Math.abs(P.vy) : Math.abs(P.vx)) / 30;
  P.sx += (1 - P.sx) * Math.min(1, dt * 14);
  P.sy += (1 - P.sy) * Math.min(1, dt * 14);
}

function updateParts(dt) {
  for (let i = waves.length - 1; i >= 0; i--) { const w = waves[i]; w.life -= dt; w.r += w.sp * dt; if (w.life <= 0) waves.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t -= dt; pops[i].y -= 30 * dt; if (pops[i].t <= 0) pops.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.vx *= 0.98; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

/* ---------- Render ---------- */
/* ---------- World art ----------
   Night ruins. Tiles are pixel-art stone bricks (the robot's stone), darker deeper inside the walls,
   with neon moss on top faces and a glowing rim on the other exposed edges. The background is three
   parallax layers built once per chapter at game resolution and drawn pixel-crisp. */
const STONE = { mortar: [17, 21, 40], b: [[44, 51, 84], [52, 60, 96], [61, 70, 108]], hi: [86, 98, 146] };
const MOSS = [[24, 104, 76], [37, 152, 106], [69, 255, 200]];
function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1013904223)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function hexRGB(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
const shade = (c, k) => [Math.min(255, c[0] * k), Math.min(255, c[1] * k), Math.min(255, c[2] * k)];

function renderRoom() {
  const ch = RD().ch, acc = CHAPTERS[ch].accent, accRGB = hexRGB(acc);
  const solid = (x, y) => tile(x, y) === '#';
  // how many tiles each wall tile is from open air: deep wall interiors get darker
  const dist = [];
  for (let y = 0; y < ROWS; y++) { dist.push([]); for (let x = 0; x < COLS; x++) dist[y].push(solid(x, y) ? 99 : 0); }
  for (let pass = 0; pass < 4; pass++) for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!dist[y][x]) continue;
    let m = 99;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < COLS && ny < ROWS) m = Math.min(m, dist[ny][nx]);
    }
    dist[y][x] = Math.min(dist[y][x], m + 1);
  }

  const pc = document.createElement('canvas'); pc.width = RW; pc.height = RH;
  const sc = document.createElement('canvas'); sc.width = RW; sc.height = RH;
  const pg = pc.getContext('2d'), sg = sc.getContext('2d');
  const img = pg.createImageData(RW, RH), d = img.data;
  const simg = sg.createImageData(RW, RH), sd = simg.data;
  const put = (X, Y, c, buf = d) => {
    if (X < 0 || Y < 0 || X >= RW || Y >= RH) return;
    const i = (Y * RW + X) * 4; buf[i] = c[0]; buf[i + 1] = c[1]; buf[i + 2] = c[2]; buf[i + 3] = 255;
  };

  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    const t = tile(tx, ty);
    if (t === '^') {
      // two pink crystal spikes at the bottom of the tile
      for (let k = 0; k < 2; k++) {
        const x0 = tx * T + 2 + k * 8;
        for (let r = 0; r < 10; r++) {
          const half = Math.max(0, Math.floor((10 - r) * 4 / 10));
          const y = ty * T + T - 1 - r;
          for (let dx = -half; dx < half; dx++) {
            const c = r >= 8 ? [255, 210, 230] : dx < 0 ? [255, 70, 150] : [190, 30, 100];
            put(x0 + 4 + dx, y, c, sd);
          }
        }
      }
      continue;
    }
    if (!solid(tx, ty)) continue;
    const depth = dist[ty][tx];
    const dk = depth <= 1 ? 1 : depth === 2 ? 0.62 : depth === 3 ? 0.4 : 0.27;
    const openUp = !solid(tx, ty - 1), openDn = !solid(tx, ty + 1);
    const openL = !solid(tx - 1, ty), openR = !solid(tx + 1, ty);
    for (let ly = 0; ly < T; ly++) for (let lx = 0; lx < T; lx++) {
      const X = tx * T + lx, Y = ty * T + ly;
      const row = Math.floor(Y / 5), sh = (row & 1) * 5;
      const bx = Math.floor((X + sh) / 10);
      let c;
      if (Y % 5 === 4 || (X + sh) % 10 === 9) c = STONE.mortar;
      else {
        const v = hash2(bx, row);
        c = STONE.b[v < 0.33 ? 0 : v < 0.75 ? 1 : 2];
        if (Y % 5 === 0) c = shade(c, 1.18);
        if (hash2(X, Y, 7) < 0.05) c = shade(c, 0.8);
      }
      c = shade(c, dk);
      if ((openL && lx === 0) || (openR && lx === T - 1) || (openDn && ly === T - 1)) c = STONE.hi;
      else if ((openL && lx === 1) || (openR && lx === T - 2)) c = shade(c, 1.15);
      put(X, Y, c);
    }
    if (openUp) {
      // neon moss on the top face, hanging a little down the bricks
      for (let lx = 0; lx < T; lx++) {
        const X = tx * T + lx, Y0 = ty * T;
        const hang = 2 + Math.floor(hash2(X, ty, 3) * 2) + (hash2(X, ty, 5) < 0.12 ? 3 : 0);
        for (let k = 0; k < hang; k++) put(X, Y0 + k, k === 0 ? MOSS[1] : MOSS[0]);
        if (hash2(X, ty, 9) < 0.07) put(X, Y0 + hang - 1, MOSS[2]);
        if (hash2(X, ty, 11) < 0.16) put(X, Y0 - 1, MOSS[1]);
      }
    }
    if (depth === 1 && !openUp && hash2(tx, ty, 21) < 0.1) {
      // a rare glowing rune carved in a wall face
      const rx = tx * T + 6 + Math.floor(hash2(tx, ty, 22) * 6), ry = ty * T + 6 + Math.floor(hash2(tx, ty, 23) * 6);
      for (const [a, b] of [[1, 0], [0, 1], [2, 1], [1, 2], [1, 3]]) put(rx + a, ry + b, shade(accRGB, 0.6));
    }
  }
  pg.putImageData(img, 0, 0);
  sg.putImageData(simg, 0, 0);

  const c = document.createElement('canvas');
  c.width = RW * DPR; c.height = RH * DPR;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.scale(DPR, DPR);
  g.drawImage(pc, 0, 0, RW, RH);
  // neon rim on sides and undersides (top faces carry the moss)
  g.beginPath();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!solid(x, y)) continue;
    const X = x * T, Y = y * T;
    if (!solid(x, y + 1)) { g.moveTo(X, Y + T + 0.5); g.lineTo(X + T, Y + T + 0.5); }
    if (!solid(x - 1, y)) { g.moveTo(X - 0.5, Y); g.lineTo(X - 0.5, Y + T); }
    if (!solid(x + 1, y)) { g.moveTo(X + T + 0.5, Y); g.lineTo(X + T + 0.5, Y + T); }
  }
  g.strokeStyle = acc; g.lineWidth = 1; g.globalAlpha = 0.6;
  g.shadowColor = acc; g.shadowBlur = 8;
  g.stroke();
  g.globalAlpha = 1;
  // soft glow under the moss
  g.shadowColor = '#45ffc8'; g.shadowBlur = 6; g.fillStyle = 'rgba(69,255,200,0.18)';
  for (let y = 1; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (solid(x, y) && !solid(x, y - 1)) g.fillRect(x * T, y * T, T, 1);
  }
  g.shadowColor = C.pink; g.shadowBlur = 8;
  g.drawImage(sc, 0, 0, RW, RH);
  g.shadowBlur = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (tile(x, y) !== 'X') continue;
    const X = x * T, Y = y * T;
    g.fillStyle = 'rgba(255,46,136,0.22)'; g.fillRect(X + 2, Y + 2, T - 4, T - 4);
    g.strokeStyle = C.pink; g.lineWidth = 1.5; g.strokeRect(X + 2.5, Y + 2.5, T - 5, T - 5);
  }
  return c;
}

/* parallax background, one set per chapter */
const BG_PADX = 48, BG_PADY = 24;
const bgCache = {};
function buildBackground(ch) {
  const accHex = CHAPTERS[ch].accent, acc = hexRGB(accHex).join(',');
  const BW = W + BG_PADX * 2, BH = H + BG_PADY * 2;
  const mk = () => { const c = document.createElement('canvas'); c.width = BW; c.height = BH; return c; };

  const sky = mk(), s = sky.getContext('2d');
  const tones = ch === 1 ? ['#0a0617', '#180f33', '#2a1742'] : ch === 2 ? ['#0c0705', '#26140c', '#3a1d0f'] : ['#03060e', '#0a1430', '#0f2439'];
  const gr = s.createLinearGradient(0, 0, 0, BH);
  gr.addColorStop(0, tones[0]); gr.addColorStop(0.6, tones[1]); gr.addColorStop(1, tones[2]);
  s.fillStyle = gr; s.fillRect(0, 0, BW, BH);
  for (let i = 0; i < 170; i++) {
    s.fillStyle = `rgba(225,240,255,${(0.12 + hash2(i, 3, ch) * 0.6).toFixed(2)})`;
    s.fillRect(hash2(i, 1, ch) * BW | 0, hash2(i, 2, ch) * BH * 0.7 | 0, 1, 1);
  }
  // a huge energy ring hanging in the sky
  const rx = BW * 0.74 | 0, ry = BH * 0.27 | 0;
  s.fillStyle = `rgba(${acc},0.05)`; s.beginPath(); s.arc(rx, ry, 44, 0, Math.PI * 2); s.fill();
  s.shadowColor = accHex; s.shadowBlur = 16;
  s.strokeStyle = `rgba(${acc},0.6)`; s.lineWidth = 2;
  s.beginPath(); s.arc(rx, ry, 46, 0, Math.PI * 2); s.stroke();
  s.strokeStyle = `rgba(${acc},0.25)`; s.lineWidth = 1;
  s.beginPath(); s.arc(rx, ry, 54, 0, Math.PI * 2); s.stroke();
  s.shadowBlur = 0;

  const far = mk(), f = far.getContext('2d');
  for (let x = -10, i = 0; x < BW; i++) {
    const w = 18 + (hash2(i, 4, ch) * 34 | 0), h = 70 + (hash2(i, 5, ch) * 150 | 0), y = BH - h;
    f.fillStyle = '#0b1024'; f.fillRect(x, y, w, h);
    for (let k = 0; k < w; k += 4) if (hash2(i, k, 6) < 0.5) f.fillRect(x + k, y - 3, 2, 3);
    for (let wy = y + 8; wy < BH - 10; wy += 9) for (let wx = x + 3; wx < x + w - 3; wx += 6) {
      if (hash2(wx, wy, ch + 9) < 0.12) {
        f.fillStyle = `rgba(${acc},${(0.2 + hash2(wx, wy, 2) * 0.4).toFixed(2)})`; f.fillRect(wx, wy, 2, 3);
      }
    }
    x += w + 4 + (hash2(i, 7, ch) * 30 | 0);
  }

  const mid = mk(), m = mid.getContext('2d');
  const stoneM = '#141c3a', edgeM = '#222e5a';
  for (let px = -30, i = 0; px < BW; px += 150, i++) {
    const x0 = px + (hash2(i, 8, ch) * 30 | 0), pw = 16, top = 130 + (hash2(i, 9, ch) * 70 | 0);
    if (hash2(i, 10, ch) < 0.65) {
      m.strokeStyle = stoneM; m.lineWidth = 8;
      m.beginPath(); m.arc(x0 + pw / 2 + 75, top + 4, 75, Math.PI, Math.PI * 2); m.stroke();
    }
    m.fillStyle = stoneM; m.fillRect(x0, top, pw, BH - top);
    m.fillStyle = edgeM; m.fillRect(x0, top, 2, BH - top);
    m.fillStyle = stoneM; m.fillRect(x0 - 3, top - 4, pw + 6, 5);

function drawMedalBanner(rdt, bottom) {

  else if (b.t < 0.35) y = 52 - (1 - b.t / 0.35) * 92;
  else y = 52;
  if (bottom) y = H - 30 + (52 - y) * 0.6;
  const col = b.skull ? '#e8e4f4' : b.ach ? '#ffd23e' : b.medal ? MEDALS[b.medal].c : '#f4fbff';
  const cx = W / 2;
  const bw = b.ach ? 160 : 124;   // achievements carry a longer description
  ctx.fillStyle = 'rgba(7,9,20,0.88)'; ctx.fillRect(cx - bw, y - 22, bw * 2, 44);
  ctx.shadowColor = col; ctx.shadowBlur = 10;
  ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.strokeRect(cx - bw + 0.5, y - 21.5, bw * 2 - 1, 43);
  ctx.shadowBlur = 0;
  // the medal: ribbon, glowing disc, star, sweeping shine
  const mx = cx - bw + 28, my = y + 3;
  ctx.fillStyle = C.pink;
  ctx.beginPath(); ctx.moveTo(mx - 8, my - 24); ctx.lineTo(mx - 2, my - 24); ctx.lineTo(mx - 1, my - 9); ctx.lineTo(mx - 6, my - 10); ctx.fill();
  ctx.fillStyle = '#3ef0ff';
  ctx.beginPath(); ctx.moveTo(mx + 2, my - 24); ctx.lineTo(mx + 8, my - 24); ctx.lineTo(mx + 6, my - 10); ctx.lineTo(mx + 1, my - 9); ctx.fill();
  const spin = Math.abs(Math.cos(Math.min(age, 0.6) * 10)) * (age < 0.6 ? 1 : 0) ; // flips as it drops in
  const sx = age < 0.6 ? 0.25 + 0.75 * (1 - spin * 0.75) : 1;

  ctx.shadowBlur = 0;

  ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.clip();
  const sweep = ((age * 1.6) % 1.6) - 0.3;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.moveTo(-14 + sweep * 30, -14); ctx.lineTo(-8 + sweep * 30, -14); ctx.lineTo(-18 + sweep * 30, 14); ctx.lineTo(-24 + sweep * 30, 14); ctx.fill();
  ctx.restore();
  // twinkles
  for (let i = 0; i < 5; i++) {
    const a = age * 2 + i * 1.256, r = 17 + (i % 2) * 4;
    const tw = Math.max(0, Math.sin(age * 9 + i * 2));
    ctx.globalAlpha = tw;
    ctx.fillStyle = '#ffffff';

    ctx.fillRect(sx2 - 2, sy2, 5, 1); ctx.fillRect(sx2, sy2 - 2, 1, 5);

function drawSpeedLines(rdt) {
  const sp = Math.abs(P.vx);
  if (state === 'play' && !P.dead && save.opts.shake && (sp > 230 || Math.abs(P.vy) > 450 || P.dashT > 0) && Math.random() < 0.6) {
    const goingUp = Math.abs(P.vy) > Math.abs(P.vx) * 1.5;
    if (goingUp) lines.push({ vert: true, x: Math.random() * W, y: P.vy < 0 ? -140 : H + 20, l: 40 + Math.random() * 100, v: (P.vy < 0 ? 1 : -1) * (900 + Math.random() * 600), life: 0.4 });
    else lines.push({ vert: false, x: P.vx >= 0 ? W + 20 : -140, y: Math.random() * H, l: 40 + Math.random() * 100, v: (P.vx >= 0 ? -1 : 1) * (900 + Math.random() * 600), life: 0.4 });
  }
  ctx.strokeStyle = 'rgba(244,251,255,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = lines.length - 1; i >= 0; i--) {
    const l = lines[i]; l.life -= rdt;
    if (l.life <= 0) { lines.splice(i, 1); continue; }
    if (l.vert) { l.y += l.v * rdt; ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y + l.l); }
    else { l.x += l.v * rdt; ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.l, l.y); }
  }
  ctx.stroke();
}

    txt(String(s.d), x0 + 340, y, '500 11px "JetBrains Mono", monospace', s.d ? C.pink : C.muted, 'right');
    if (s.medal) { ctx.fillStyle = MEDALS[s.medal].c; ctx.beginPath(); ctx.arc(x0 + 225, y, 3.5, 0, Math.PI * 2); ctx.fill(); }
  });
  if (online) {
    txt('CLASSEMENT', W - 16, 114, '700 9px "Chakra Petch", sans-serif', C.green, 'right', '2px');
    drawRaceBoard(W - 16, 130, 'right');
  }
  const items = endItems();
  const my = y0 + 24 + runSplits.length * 14 + 8;
  drawMenu(items, W / 2, Math.min(my, H - 14 - items.length * 20), 20);
}

function render(rdt) {
  clock += rdt;
  shake = Math.max(0, shake - rdt * 40);
  flash = Math.max(0, flash - rdt * 2.2);
  glitch = Math.max(0, glitch - rdt);
  if (state === 'play') banner = Math.max(0, banner - rdt);
  if (splitMsg) splitMsg.t -= rdt;
  if (toast) { toast.t -= rdt; if (toast.t <= 0) toast = null; }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const ox = (Math.random() * 2 - 1) * shake, oy = (Math.random() * 2 - 1) * shake;
  let toff = 0;
  if (trans) {
    const k = Math.min(1, 1 - trans.t / TRANS_T);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;   // ease in-out
    toff = Math.round((1 - e) * W);
    ctx.save(); ctx.translate(toff, 0);
  }
  drawBackdrop();
  ctx.save(); ctx.translate(ox - Math.round(camX), oy - Math.round(camY));
  ctx.drawImage(cache, 0, 0, RW, RH);
  drawDynamic();
  if (!online) drawGhost();
  drawRivals();
  drawHubPeers();
  if (state !== 'title' && state !== 'select' && state !== 'lobby' && state !== 'mpmenu') drawPlayer();
  drawParts();
  ctx.restore();
  drawSpeedLines(rdt);
  if (trans) {
    ctx.restore();
    // the previous screen, sliding out to the left
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(transSnap, Math.round((toff - W) * DPR), 0);
    ctx.restore();
    // glowing seam between the two rooms, with motion streaks
    ctx.fillStyle = accent(); ctx.shadowColor = accent(); ctx.shadowBlur = 14;
    ctx.fillRect(toff - 1, 0, 2, H);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(244,251,255,0.25)';
    for (let i = 0; i < 10; i++) {
      const y = (hash2(i, 5, 31) * H) | 0, l = 30 + hash2(i, 6, 31) * 90;
      ctx.fillRect(toff - l * 0.3, y, l, 1);
    }
  }

  if (glitch > 0) {
    for (let i = 0; i < 7; i++) {
      const y = Math.random() * H, h = 2 + Math.random() * 14, dx = (Math.random() * 2 - 1) * 18;
      ctx.drawImage(cv, 0, y * DPR, W * DPR, h * DPR, dx, y, W, h);
    }
    ctx.fillStyle = `rgba(255,46,136,${glitch * 0.35})`; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(244,251,255,${flash * (save.opts.flash ? 0.35 : 0.1)})`; ctx.fillRect(0, 0, W, H); }
  if (tint) {
    ctx.globalAlpha = Math.max(0, tint.t) * 1.2; ctx.fillStyle = tint.col; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    tint.t -= rdt; if (tint.t <= 0) tint = null;
  }

  if (state === 'play') drawHUD();
  else if (state === 'hub') drawHubHUD();
  else if (state === 'ach') drawAch();
  else if (state === 'pause') { drawHUD(); drawPause(); }
  else if (state === 'title') drawTitle();
  else if (state === 'select') drawSelect();
  else if (state === 'options') drawOptions();
  else if (state === 'end') drawEnd();
  else if (state === 'tech') { if (techFrom === 'pause') drawHUD(); drawTech(); }
  else if (state === 'lobby') drawLobby();
  else if (state === 'keys') drawKeys();
  else if (state === 'mpmenu') drawMp();
  else if (state === 'countdown') { drawHUD(); drawCountdown(); }
  if (state === 'play' || state === 'pause' || state === 'countdown') drawMedalBanner(state === 'pause' ? 0 : rdt);
  else if (state === 'end' || state === 'hub') drawMedalBanner(rdt, state === 'end');

  if (toast) {
    ctx.globalAlpha = Math.min(1, toast.t * 2);
    ctx.fillStyle = 'rgba(11,15,33,0.9)'; ctx.fillRect(W / 2 - 90, H - 58, 180, 22);
    txt(toast.text, W / 2, H - 47, '700 11px "Chakra Petch", sans-serif', C.white, 'center', '1px');
    ctx.globalAlpha = 1;
  }
}

/* ---------- Audio ---------- */
let AC = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null, muted = false, nextT = 0, stepN = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.connect(master);
    sfxBus = AC.createGain(); sfxBus.connect(master);
    applyVolumes();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = AC.currentTime + 0.05;
    setInterval(schedule, 25);
  } catch (e) { AC = null; }
}
function applyVolumes() {
  if (!AC) return;
  master.gain.value = muted ? 0 : 1;
  musicBus.gain.value = save.opts.music / 10 * 0.6;
  sfxBus.gain.value = save.opts.sfx / 10 * 0.7;
}
function toggleMute() { muted = !muted; applyVolumes(); toast = { text: muted ? 'Son coupé' : 'Son activé', t: 1.2 }; }
function tone(f, dur, type = 'square', vol = 0.1, slide = 0, t0 = 0, bus = null) {
  if (!AC) return;
  const t = t0 || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq = 1200, type = 'bandpass', t0 = 0, bus = null) {
  if (!AC) return;
  const t = t0 || AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(bus || sfxBus); s.start(t); s.stop(t + dur + 0.02);
}
function kick(t, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.22);
}
function sweep(t, dur, vol, f0, f1, type = 'bandpass') {
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = 2;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.02);
}
function sfx(n) {
  if (!AC) return;
  switch (n) {
    case 'jump': tone(480, 0.09, 'square', 0.06, 1.7); break;
    case 'wall': tone(380, 0.09, 'square', 0.06, 2); noise(0.04, 0.05, 3000); break;
    case 'run': tone(300, 0.14, 'sawtooth', 0.05, 2.2); break;
    case 'launch': tone(400, 0.2, 'square', 0.07, 2.6); noise(0.08, 0.06, 2500); break;
    case 'super': tone(260, 0.18, 'sawtooth', 0.08, 3); noise(0.1, 0.08, 3500); break;
    case 'swap': tone(phase ? 660 : 880, 0.06, 'square', 0.05); tone(phase ? 990 : 1320, 0.08, 'square', 0.04, 1, AC.currentTime + 0.04); break;
    case 'flowup': tone(880, 0.08, 'triangle', 0.05); tone(1320, 0.12, 'triangle', 0.05, 1, AC.currentTime + 0.06); break;
    case 'flowmax': { const t = AC.currentTime; sweep(t, 0.5, 0.08, 400, 8000); [1046.5, 1318.5, 1568, 2093].forEach((f, k) => tone(f, 0.25, 'square', 0.04, 1, t + k * 0.05)); break; }
    case 'whoosh': sweep(AC.currentTime, 0.22, 0.09, 300, 3500); break;
    case 'hyper': {
      const t = AC.currentTime;
      kick(t, 0.55); sweep(t, 0.28, 0.16, 400, 6000);
      tone(220, 0.24, 'sawtooth', 0.07, 6, t);
      [880, 1108.7, 1318.5, 1760].forEach((f, i) => tone(f, 0.3, 'triangle', 0.07, 1, t + 0.05 + i * 0.035));
      tone(2637, 0.4, 'sine', 0.04, 1, t + 0.18);
      break;
    }
    case 'corner': {
      const t = AC.currentTime;
      kick(t, 0.5);
      tone(1568, 0.12, 'square', 0.04, 1, t); tone(2093, 0.16, 'square', 0.035, 1, t + 0.01);
      tone(3136, 0.35, 'triangle', 0.04, 1, t + 0.02);
      tone(330, 0.16, 'sawtooth', 0.06, 3, t);
      [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, 0.28, 'triangle', 0.06, 1, t + 0.06 + i * 0.03));
      break;
    }
    case 'record': {
      const t = AC.currentTime;
      [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.16, 'square', 0.05, 1, t + i * 0.08));
      [1568, 1976, 2349].forEach(f => tone(f, 0.6, 'triangle', 0.045, 1, t + 0.34));
      sweep(t + 0.3, 0.5, 0.05, 3000, 9000, 'highpass');
      break;
    }
    case 'medal': {
      const t = AC.currentTime;
      kick(t, 0.4);
      [523.3, 659.3, 784, 1046.5, 1318.5, 1568].forEach((f, i) => tone(f, 0.18, 'square', 0.045, 1, t + i * 0.06));
      [1046.5, 1318.5, 1568, 2093].forEach(f => tone(f, 0.9, 'triangle', 0.045, 1, t + 0.4));
      kick(t + 0.4, 0.45);
      sweep(t + 0.38, 0.8, 0.06, 2500, 10000, 'highpass');
      break;
    }
    case 'dash': noise(0.12, 0.12, 2200); tone(900, 0.1, 'sawtooth', 0.05, 0.5); break;
    case 'refill': tone(1320, 0.05, 'sine', 0.07); tone(1760, 0.07, 'sine', 0.05, 1, AC.currentTime + 0.04); break;
    case 'orb': tone(988, 0.14, 'sine', 0.1, 1.5); break;
    case 'pad': tone(180, 0.28, 'sawtooth', 0.08, 4); break;
    case 'land': noise(0.05, 0.08, 600, 'lowpass'); break;
    case 'crumble': noise(0.12, 0.07, 400, 'lowpass'); break;
    case 'tick': tone(880, 0.03, 'square', 0.03); break;
    case 'die': noise(0.3, 0.22, 900); tone(220, 0.3, 'sawtooth', 0.12, 0.25); break;
    case 'clear': tone(660, 0.07, 'square', 0.06); tone(990, 0.12, 'square', 0.06, 1, AC.currentTime + 0.06); break;
    case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.06, 1, AC.currentTime + i * 0.09)); break;
  }
}
const BPM = 150, S16 = 60 / BPM / 4;
const ROOT_SETS = [[45, 41, 48, 43], [42, 38, 45, 40], [47, 43, 50, 45]];
const BASS = [0, 12, 0, 12, 0, 12, 7, 12, 0, 12, 0, 12, 0, 7, 12, 7];
const ARP = [0, 3, 7, 10];
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
function schedule() {
  if (!AC || muted) { if (AC) nextT = AC.currentTime + 0.05; return; }
  while (nextT < AC.currentTime + 0.12) { playStep(stepN, nextT); nextT += S16; stepN = (stepN + 1) % 64; }
}
const LEAD = [12, 15, 19, 22, 24, 22, 19, 15, 12, 15, 19, 24, 27, 24, 22, 19];
function playStep(s, t) {
  const roots = ROOT_SETS[RD().ch % ROOT_SETS.length];
  const i = s % 16, root = roots[Math.floor(s / 16) % 4];
  const quiet = state !== 'play';
  // music layers follow the flow level: 0 kick+bass, 1 +hats, 2 +snare+arp, 3 +lead and open filter
  const lv = quiet ? 0 : flowLv;
  if (i % 4 === 0 || (lv >= 3 && i % 4 === 2 && i !== 14)) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(quiet ? 0.18 : (i % 4 === 0 ? 0.42 : 0.22), t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.16);
  }
  if (!quiet && lv >= 1 && (i % 2 === 1 || lv >= 3)) noise(0.03, lv >= 3 ? 0.03 : 0.035, 8000, 'highpass', t, musicBus);
  if (!quiet && lv >= 2 && (i === 4 || i === 12)) noise(0.12, 0.09, 1800, 'bandpass', t, musicBus);
  const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.value = mf(root + BASS[i]);
  const cut = [520, 900, 1200, 2200][lv];
  f.type = 'lowpass'; f.frequency.setValueAtTime(cut, t); f.frequency.exponentialRampToValueAtTime(250, t + S16);
  g.gain.setValueAtTime(quiet ? 0.035 : 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + S16 * 0.95);
  o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t + S16);
  if (!quiet && lv >= 2) tone(mf(root + 24 + ARP[i % 4] + (s % 32 >= 16 ? 12 : 0)), S16 * 0.8, 'triangle', 0.022, 0, t, musicBus);
  if (!quiet && lv >= 3 && i % 2 === 0) {
    const lo = AC.createOscillator(), lf = AC.createBiquadFilter(), lg = AC.createGain();
    lo.type = 'square'; lo.frequency.value = mf(root + 12 + LEAD[i]);
    lf.type = 'lowpass'; lf.frequency.value = 2600;
    lg.gain.setValueAtTime(0.028, t); lg.gain.exponentialRampToValueAtTime(0.0001, t + S16 * 1.8);
    lo.connect(lf); lf.connect(lg); lg.connect(musicBus); lo.start(t); lo.stop(t + S16 * 2);
  }
}

/* ---------- Loop ---------- */
loadRoom(0, false);
let acc = 0, last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  const rdt = dt;
  pollPad();
  if (trans) { trans.t -= rdt; if (trans.t <= 0) trans = null; dt = 0; acc = 0; }
  if (hitstop > 0) { hitstop -= dt; dt = 0; }
  if (state === 'countdown') {
    const before = Math.ceil(countT);
    countT -= rdt;
    if (Math.ceil(countT) !== before) sfx(countT > 0 ? 'tick' : 'clear');
    if (countT <= 0) { state = 'play'; setPresence({ go: null }); }
  }
  syncPresence(rdt);
  const scale = slowmo > 0 ? 0.35 : 1; slowmo -= rdt;
  acc += dt * scale;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render(rdt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus({ preventScroll: true });
})();
</script>
